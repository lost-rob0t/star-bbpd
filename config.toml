# BBP Actor Service Configuration

[service]
name = "bbp-actors"
log_level = "INFO"
json_pretty = false
publisher_pool_size = 3
tool_pool_size = 2

[documents]
host = "bots.star.intel"
port = 5672
vhost = "/"
username = "guest"
password = "guest"
exchange = "documents"
exchange_type = "topic"
heartbeat_sec = 30

[events]
exchange = "events"
exchange_type = "topic"

[routing]
target_key = "actors.{actor}.new.target"
doc_key = "document.new.{dtype}"
event_key = "event.{eventType}"

# Actor Configurations
[actors]

[actors.subfinder]
enabled = true
queue = "bbp.subfinder.targets"
prefetch = 3
emit_relations = true

[actors.nmap]
enabled = true
queue = "bbp.nmap.targets"
prefetch = 2
emit_relations = true

[actors.httpx]
enabled = true
queue = "bbp.httpx.targets"
prefetch = 5
emit_relations = true

[actors.katana]
enabled = true
queue = "bbp.katana.targets"
prefetch = 3
emit_relations = true

# Tool Configurations
[tools]

[tools.subfinder]
bin = "subfinder"
timeout_sec = 300
args = ["-silent"]

[tools.nmap]
bin = "nmap"
timeout_sec = 1800
args = ["-sV"]

[tools.httpx]
bin = "httpx"
timeout_sec = 600
args = ["-silent", "-json"]

[tools.katana]
bin = "katana"
timeout_sec = 900
args = ["-silent", "-json"]
