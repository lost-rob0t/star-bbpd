[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-bbpd"
version = "0.2.0"
description = "StarIntel bug-bounty, reconnaissance, and web evidence actor service"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6,<3",
    "pika>=1.3,<2",
    "pykka>=4,<5",
    "ulid-py>=1.1,<2",
    "tomli>=2,<3; python_version<'3.11'",
    "starintel-doc @ git+https://github.com/lost-rob0t/starintel-doc.git@105df2d684a379531e59b0d281f3c911ac482c2c",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
star-bbpd = "bbp.main:main"
star-bbpd-manifests = "bbp.manifest_cli:main"
star-bbpd-http-capture = "bbp.http_capture_adapter:main"

[tool.setuptools]
packages = ["bbp", "bbp.tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
