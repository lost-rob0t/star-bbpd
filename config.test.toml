# BBP Actor Service Test Configuration
# This config enables only subfinder for initial testing

[service]
name = "bbp-actors-test"
log_level = "DEBUG"
json_pretty = false

[documents]
host = "bots.star.intel"
port = 5672
vhost = "/"
username = "guest"
password = "guest"
exchange = "documents"
exchange_type = "topic"
heartbeat_sec = 30

[events]
exchange = "events"
exchange_type = "topic"

[routing]
target_key = "actors.{actor}.new.target"
doc_key = "document.new.{dtype}"
event_key = "event.{eventType}"

# Only Subfinder enabled for testing
[actors.subfinder]
enabled = true
queue = "actor.subfinder.new.target"
prefetch = 1
emit_relations = true

[tools.subfinder]
bin = "subfinder"
timeout_sec = 300
args = ["-silent"]

# Other actors disabled for testing
[actors.nmap]
enabled = false
queue = "bbp.nmap.targets"
prefetch = 1
emit_relations = true

[tools.nmap]
bin = "nmap"
timeout_sec = 1800
args = ["-sV"]

[actors.httpx]
enabled = false
queue = "bbp.httpx.targets"
prefetch = 2
emit_relations = true

[tools.httpx]
bin = "httpx"
timeout_sec = 600
args = ["-silent", "-json"]

[actors.katana]
enabled = false
queue = "bbp.katana.targets"
prefetch = 1
emit_relations = true

[tools.katana]
bin = "katana"
timeout_sec = 900
args = ["-silent", "-json"]
