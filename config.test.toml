# Local BBP Actor Service test configuration.

[service]
name = "bbp-actors-test"
star_authority = "bbpd.test.actor"
log_level = "DEBUG"
json_pretty = false
publisher_pool_size = 1
tool_pool_size = 1

[documents]
host = "localhost"
port = 5672
vhost = "/"
username = "bbp-local"
password = "replace-me"
exchange = "documents"
exchange_type = "topic"
heartbeat_sec = 30

[events]
exchange = "events"
exchange_type = "topic"

[routing]
target_key = "actors.{actor}.new.target"
target_dispatch_key = "documents.target.dispatch.{actor}"
document_ingest_key = "documents.ingest.{dtype}"
document_update_key = "documents.updated.{dtype}"
document_new_key = "documents.new.{dtype}"
event_key = "event.{eventType}"

[actors.subfinder]
enabled = true
queue = "bbp.subfinder.targets"
prefetch = 1
emit_relations = true

[tools.subfinder]
bin = "subfinder"
timeout_sec = 300
args = ["-silent"]

[actors.nmap]
enabled = false
queue = "bbp.nmap.targets"
prefetch = 1
emit_relations = true

[tools.nmap]
bin = "nmap"
timeout_sec = 1800
args = ["-sV"]

[actors.httpx]
enabled = false
queue = "bbp.httpx.targets"
prefetch = 2
emit_relations = true

[tools.httpx]
bin = "httpx"
timeout_sec = 600
args = ["-silent", "-json"]

[actors.katana]
enabled = false
queue = "bbp.katana.targets"
prefetch = 1
emit_relations = true

[tools.katana]
bin = "katana"
timeout_sec = 900
args = ["-silent", "-json"]
