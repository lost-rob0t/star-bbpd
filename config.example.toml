# Copy this file to config.toml and set local credentials.
# config.toml is intentionally ignored by Git.

[service]
name = "bbp-actors"
log_level = "INFO"
json_pretty = false
publisher_pool_size = 3
tool_pool_size = 2
publisher_max_retries = 3
publisher_retry_delays_sec = [1, 2, 4]
publish_settlement_timeout_sec = 30
shutdown_timeout_sec = 60

[documents]
host = "localhost"
port = 5672
vhost = "/"
username = "bbp-local"
password = "replace-me"
exchange = "documents"
exchange_type = "topic"
heartbeat_sec = 30

[events]
exchange = "events"
exchange_type = "topic"

[routing]
target_key = "actors.{actor}.new.target"
document_ingest_key = "documents.ingest.{dtype}"
document_update_key = "documents.updated.{dtype}"
document_new_key = "documents.new.{dtype}"
event_key = "event.{eventType}"

[actors]

[actors.subfinder]
enabled = true
queue = "bbp.subfinder.targets"
prefetch = 3
emit_relations = true

[actors.nmap]
enabled = true
queue = "bbp.nmap.targets"
prefetch = 2
emit_relations = true

[actors.httpx]
enabled = true
queue = "bbp.httpx.targets"
prefetch = 5
emit_relations = true

[actors.katana]
enabled = true
queue = "bbp.katana.targets"
prefetch = 3
emit_relations = true

[tools]

[tools.subfinder]
bin = "subfinder"
timeout_sec = 300
publish_timeout_sec = 30
args = ["-silent"]

[tools.nmap]
bin = "nmap"
timeout_sec = 1800
publish_timeout_sec = 30
args = ["-sV"]

[tools.httpx]
bin = "httpx"
timeout_sec = 600
publish_timeout_sec = 30
args = ["-silent", "-json"]

[tools.katana]
bin = "katana"
timeout_sec = 900
publish_timeout_sec = 30
args = ["-silent", "-json"]

[dns_resolver]
enabled = true
queue = "bbp.dns-resolver.domains"
prefetch = 5
timeout_sec = 5
publish_timeout_sec = 30
shutdown_timeout_sec = 60
# nameservers = ["1.1.1.1", "1.0.0.1"]
