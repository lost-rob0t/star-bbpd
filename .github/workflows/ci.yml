name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STARINTEL_DOC_COMMIT: 980f7a217a0d28f22508c2f05831ceb2fefe8bd0
  STARINTEL_SCHEMA_COMMIT: ff814ff63868286d68e21502122832802cd5e361

jobs:
  config-safety:
    name: Config safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked runtime config
        run: |
          if git ls-files --error-unmatch config.toml >/dev/null 2>&1; then
            echo "config.toml must never be tracked"
            exit 1
          fi
          grep -Fxq "config.toml" .gitignore
          test -f config.example.toml

      - name: Reject retired production hostname
        run: |
          retired_host='bots.star'".intel"
          if git grep -n "$retired_host" -- ':!*.lock'; then
            echo "retired production broker hostname is still tracked"
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema and fixtures
        uses: actions/checkout@v4
        with:
          repository: nsaspy/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Verify pinned StarIntel package
        run: |
          python - <<'PY'
          from bbp.document_boundary import (
              STARINTEL_DOC_COMMIT,
              SCHEMA_COMMIT,
              SCHEMA_REVISION,
              load_schema_contract,
          )
          assert STARINTEL_DOC_COMMIT == "${{ env.STARINTEL_DOC_COMMIT }}"
          assert SCHEMA_COMMIT == "${{ env.STARINTEL_SCHEMA_COMMIT }}"
          assert load_schema_contract().schema_revision == SCHEMA_REVISION
          PY
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Compile
        run: python -m compileall -q bbp tests

      - name: Lint critical failures
        run: ruff check bbp tests

      - name: Test
        run: pytest --cov=bbp --cov-report=term-missing
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Run upstream Python conformance fixtures
        if: matrix.python-version == '3.13'
        working-directory: conformance-source
        run: |
          python -m conformance.runner test \
            --producer python \
            --consumer python \
            --adapter "python=sh -c 'cd $GITHUB_WORKSPACE && python -m starintel_doc.conformance_adapter'"
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Build package
        run: python -m build

      - name: Verify dependency graph
        run: python -m pip check

  determinism:
    name: Determinism across Python versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema
        uses: actions/checkout@v4
        with:
          repository: nsaspy/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project for 3.10
        run: python -m venv /tmp/venv310 && /tmp/venv310/bin/pip install --editable ".[dev]"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project for 3.13
        run: python -m venv /tmp/venv313 && /tmp/venv313/bin/pip install --editable ".[dev]"

      - name: Run deterministic contract on 3.10
        run: |
          STARINTEL_CONFORMANCE_ROOT=$GITHUB_WORKSPACE/conformance-source \
            /tmp/venv310/bin/pytest -q \
            tests/test_deterministic_identity.py \
            tests/test_recursive_provenance.py \
            tests/test_recursion_settlement.py \
            tests/test_source_guards.py \
            tests/test_tool_settlement.py \
            tests/test_dns_settlement.py

      - name: Run deterministic contract on 3.13
        run: |
          STARINTEL_CONFORMANCE_ROOT=$GITHUB_WORKSPACE/conformance-source \
            /tmp/venv313/bin/pytest -q \
            tests/test_deterministic_identity.py \
            tests/test_recursive_provenance.py \
            tests/test_recursion_settlement.py \
            tests/test_source_guards.py \
            tests/test_tool_settlement.py \
            tests/test_dns_settlement.py

      - name: Require byte-equivalent serialization across versions
        run: |
          PYTHONHASHSEED=random /tmp/venv310/bin/python tests/determinism_probe.py \
            > /tmp/determinism-3.10.txt
          PYTHONHASHSEED=random /tmp/venv313/bin/python tests/determinism_probe.py \
            > /tmp/determinism-3.13.txt
          cmp /tmp/determinism-3.10.txt /tmp/determinism-3.13.txt

  rabbitmq-routing:
    name: RabbitMQ routing replay and settlement
    runs-on: ubuntu-latest
    # No `ports` mapping: on the shared Forgejo runner host, publishing 5672
    # collides with any concurrent job that does the same. The service is
    # reachable from the job container by its DNS alias on the job network.
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema
        uses: actions/checkout@v4
        with:
          repository: nsaspy/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Verify durable routing replay and settlement contracts
        run: |
          pytest -q \
            tests/test_rabbitmq_routing_integration.py \
            tests/test_rabbitmq_identity_integration.py
        env:
          BBPD_RABBITMQ_INTEGRATION: "1"
          BBPD_TEST_RABBITMQ_HOST: rabbitmq
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

  nix:
    name: Nix build and flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Full URL: the forge does not mirror cachix/install-nix-action under
      # its action alias, so the owner/repo shorthand fails to clone there.
      - uses: https://github.com/cachix/install-nix-action@v31.10.6
      - run: nix flake check --show-trace
      - run: nix build --show-trace

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - config-safety
      - python
      - determinism
      - rabbitmq-routing
      - nix
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          CONFIG_RESULT: ${{ needs.config-safety.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DETERMINISM_RESULT: ${{ needs.determinism.result }}
          RABBITMQ_RESULT: ${{ needs.rabbitmq-routing.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "$CONFIG_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$DETERMINISM_RESULT" = "success"
          test "$RABBITMQ_RESULT" = "success"
          test "$NIX_RESULT" = "success"
