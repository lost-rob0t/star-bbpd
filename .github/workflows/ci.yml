name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STARINTEL_DOC_COMMIT: 5857914a1e34ad18a6956b8ff0df5349de0ca099
  STARINTEL_SCHEMA_COMMIT: 6479c0a9dc88ce9fed183515fc4df5d245de0b3a

jobs:
  config-safety:
    name: Config safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked runtime config
        run: |
          if git ls-files --error-unmatch config.toml >/dev/null 2>&1; then
            echo "config.toml must never be tracked"
            exit 1
          fi
          grep -Fxq "config.toml" .gitignore
          test -f config.example.toml

      - name: Reject retired production hostname
        run: |
          retired_host='bots.star'".intel"
          if git grep -n "$retired_host" -- ':!*.lock'; then
            echo "retired production broker hostname is still tracked"
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema and fixtures
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Verify pinned StarIntel 0.9.1 contract
        run: |
          python - <<'PY'
          from bbp.document_boundary import (
              RELEASE_VERSION,
              STARINTEL_DOC_COMMIT,
              SCHEMA_COMMIT,
              SCHEMA_REVISION,
              load_schema_contract,
          )
          assert STARINTEL_DOC_COMMIT == "${{ env.STARINTEL_DOC_COMMIT }}"
          assert SCHEMA_COMMIT == "${{ env.STARINTEL_SCHEMA_COMMIT }}"
          contract = load_schema_contract()
          assert RELEASE_VERSION == "0.9.1"
          assert contract.release_version == RELEASE_VERSION
          assert contract.schema_revision == SCHEMA_REVISION
          dtypes = {
              branch.get("if", {}).get("properties", {}).get("dtype", {}).get("const")
              for branch in contract.schema.get("allOf", [])
          }
          assert {"observation", "operation"} <= dtypes
          PY
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Compile
        run: python -m compileall -q bbp tests

      - name: Lint critical failures
        run: ruff check bbp tests

      - name: Test
        run: pytest --cov=bbp --cov-report=term-missing --cov-report=xml
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Run upstream Python conformance fixtures
        if: matrix.python-version == '3.13'
        working-directory: conformance-source
        run: |
          python -m conformance.runner test \
            --producer python \
            --consumer python \
            --adapter "python=sh -c 'cd $GITHUB_WORKSPACE && python -m starintel_doc.conformance_adapter'"
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Build package
        run: python -m build

      - name: Verify dependency graph
        run: python -m pip check

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  determinism:
    name: Determinism Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run deterministic identity and provenance contract
        run: |
          pytest -q \
            tests/test_deterministic_identity.py \
            tests/test_recursive_provenance.py \
            tests/test_recursion_settlement.py \
            tests/test_source_guards.py \
            tests/test_tool_settlement.py \
            tests/test_dns_settlement.py
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

      - name: Produce deterministic process probe
        run: PYTHONHASHSEED=random python tests/determinism_probe.py > determinism.txt

      - name: Upload deterministic process probe
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.python-version }}
          path: determinism.txt

  cross-version-determinism:
    name: Cross-version deterministic serialization
    runs-on: ubuntu-latest
    needs:
      - determinism
    steps:
      - name: Download Python 3.10 probe
        uses: actions/download-artifact@v4
        with:
          name: determinism-3.10
          path: python-3.10

      - name: Download Python 3.13 probe
        uses: actions/download-artifact@v4
        with:
          name: determinism-3.13
          path: python-3.13

      - name: Require byte-equivalent serialization
        run: cmp python-3.10/determinism.txt python-3.13/determinism.txt

  rabbitmq-routing:
    name: RabbitMQ routing replay and settlement
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned StarIntel schema
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ env.STARINTEL_SCHEMA_COMMIT }}
          path: conformance-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Verify durable routing replay and settlement contracts
        run: |
          pytest -q \
            tests/test_rabbitmq_routing_integration.py \
            tests/test_rabbitmq_identity_integration.py
        env:
          BBPD_RABBITMQ_INTEGRATION: "1"
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source

  nix:
    name: Nix build and flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.10.6
      - run: nix flake check --show-trace
      - run: nix build --show-trace

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - config-safety
      - python
      - determinism
      - cross-version-determinism
      - rabbitmq-routing
      - nix
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          CONFIG_RESULT: ${{ needs.config-safety.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DETERMINISM_RESULT: ${{ needs.determinism.result }}
          CROSS_VERSION_RESULT: ${{ needs.cross-version-determinism.result }}
          RABBITMQ_RESULT: ${{ needs.rabbitmq-routing.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "$CONFIG_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$DETERMINISM_RESULT" = "success"
          test "$CROSS_VERSION_RESULT" = "success"
          test "$RABBITMQ_RESULT" = "success"
          test "$NIX_RESULT" = "success"
